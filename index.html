<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الرائد التعليمية الذكية للرياضيات | أ. محمد عبدالله جمعة | المدارس المتقدمة للتعلم الذكي</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Readex+Pro:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="assets/css/platform.css">
  
  <link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body>

  <!-- ================= Top Navigation Bar ================= -->
  <header class="platform-navbar">
    <div class="nav-brand" onclick="window.Platform.switchView('cockpit')">
      <img src="assets/img/logo.png" alt="شعار المدارس المتقدمة" class="nav-logo" onerror="this.style.display='none'">
      <div class="nav-titles">
        <div class="nav-title-row">
          <span class="nav-title-text">منصة الرائد التعليمية</span>
          <span class="nav-badge-pill">الإصدار ٢.٠</span>
        </div>
        <p class="nav-teacher-tag">أ. محمد عبدالله جمعة • المدارس المتقدمة الذكية</p>
      </div>
    </div>

    <!-- Real-time Curriculum Search -->
    <div class="nav-center-search">
      <svg class="nav-search-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="nav-search" class="nav-search-input" placeholder="ابحث في المناهج والمسائل (Ctrl + K)...">
      <span class="nav-search-kbd">Ctrl K</span>
    </div>

    <!-- Quick Navigation Actions (Creative SVG Chips) -->
    <div class="nav-actions">
      <button class="nav-chip-btn" id="btn-theme-toggle" title="تبديل الوضع الليلي والنهاري">
        <span class="nav-chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
        <span class="nav-chip-label">الوضع الليلي</span>
      </button>

      <button class="nav-chip-btn" onclick="window.Platform.switchView('question-bank')" title="بنك الأسئلة الشامل">
        <span class="nav-chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v4M12 14v4M16 14v4"></path>
          </svg>
        </span>
        <span class="nav-chip-label">بنك الأسئلة</span>
      </button>

      <button class="nav-chip-btn primary" onclick="window.Platform.switchView('exam-builder')" title="منشئ الاختبارات">
        <span class="nav-chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="9" y1="13" x2="15" y2="13"></line>
            <line x1="9" y1="17" x2="13" y2="17"></line>
          </svg>
          <span class="exam-count-badge" id="nav-exam-count-badge">٠</span>
        </span>
        <span class="nav-chip-label">منشئ الاختبارات</span>
      </button>

      <button class="nav-chip-btn" onclick="window.Platform.switchView('suites')" title="الأجنحة والمختبرات التفاعلية">
        <span class="nav-chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </span>
        <span class="nav-chip-label">الأجنحة التفاعلية</span>
      </button>

      <button class="nav-chip-btn" onclick="window.Platform.switchView('vault')" title="مركز التحميل">
        <span class="nav-chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </span>
        <span class="nav-chip-label">مركز التحميل</span>
      </button>

      <button class="nav-chip-btn" onclick="window.Platform.switchView('builder')" title="إضافة درس">
        <span class="nav-chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
        </span>
        <span class="nav-chip-label">إضافة درس</span>
      </button>
    </div>
    <div id="nav-flash-bar" class="nav-flash-bar"></div>
  </header>

  <!-- ================= App Container ================= -->
  <div class="app-container">
    
    <!-- Sidebar: Hierarchical Curriculum Tree -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-row">
          <div class="sidebar-title">
            <span>🌳 شجرة المناهج الدراسية</span>
          </div>
          <span style="font-size:0.75rem; color:#93c5fd; background:rgba(30,58,138,0.6); padding:2px 8px; border-radius:12px;">الفصلان الدراسيان</span>
        </div>

        <!-- Term Filter Tabs -->
        <div class="term-filter-tabs">
          <button class="term-tab-btn active" data-term="all">الكل</button>
          <button class="term-tab-btn" data-term="term1">🍂 الفصل ١</button>
          <button class="term-tab-btn" data-term="term2">❄️ الفصل ٢</button>
        </div>
      </div>

      <!-- Scrollable Tree Structure -->
      <div class="sidebar-scrollable" id="sidebar-tree">
        <!-- Rendered dynamically by platform.js -->
      </div>
    </aside>

    <!-- Main Viewport Content Area -->
    <main class="app-viewport">
      
      <!-- View Switcher Group -->
      <div class="viewport-top-tabs">
        <div class="view-switcher-group">
          <button class="view-tab-btn active" data-view="cockpit">
            🎯 مركز الدرس التفاعلي
          </button>
          <button class="view-tab-btn" data-view="question-bank">
            🏦 بنك الأسئلة الشامل (١ م / ٦ ب)
          </button>
          <button class="view-tab-btn" data-view="exam-builder">
            📝 منشئ الاختبارات (فترة / نهائي) <span class="exam-count-badge" id="exam-count-badge">٠</span>
          </button>
          <button class="view-tab-btn" data-view="visual-tree">
            🌳 خريطة المناهج الشجرية
          </button>
          <button class="view-tab-btn" data-view="suites">
            🌟 الأجنحة والمختبرات الذكية
          </button>
          <button class="view-tab-btn" data-view="vault">
            📥 مركز التحميل والطباعة (PDF)
          </button>
          <button class="view-tab-btn" data-view="builder">
            ➕ استوديو توسيع المناهج
          </button>
        </div>
        <div>
          <button class="nav-btn" onclick="window.print()">🖨️ طباعة الصفحة الحالية</button>
        </div>
      </div>

      <!-- Dynamic Content Injection Container -->
      <div id="app-viewport">
        <!-- Content injected dynamically by platform.js -->
      </div>

    </main>

  </div>

  <!-- Scripts -->
  <script src="assets/js/arabic_utils.js"></script>
  <script src="assets/js/grade6_book_data.js"></script>
  <script src="assets/js/grade1m_book_data.js"></script>
  <script src="assets/js/curriculum_tree.js"></script>
  <script src="assets/js/exam_exporter.js"></script>
  <script src="assets/js/question_bank.js"></script>
  <script src="assets/js/exam_builder.js"></script>
  <script src="assets/js/platform.js"></script>

</body>
</html>
